name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | head -80

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project NotificationIsland.xcodeproj \
            -scheme NotificationIsland \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            INFOPLIST_OUTPUT_FORMAT=xml

      - name: Validate Live Activity build
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/NotificationIsland.app"
          WIDGET_PATH="$APP_PATH/PlugIns/NotificationIslandWidget.appex"

          test -d "$APP_PATH"
          test -x "$APP_PATH/NotificationIsland"
          test -d "$WIDGET_PATH"
          test -f "$WIDGET_PATH/NotificationIslandWidget"

          plutil -lint "$APP_PATH/Info.plist"
          plutil -lint "$WIDGET_PATH/Info.plist"

          LIVE_ACTIVITIES=$(/usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$APP_PATH/Info.plist")
          test "$LIVE_ACTIVITIES" = "true"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/NotificationIsland.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry NotificationIsland-unsigned.ipa Payload
          unzip -tq NotificationIsland-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NotificationIsland-IPA
          path: NotificationIsland-unsigned.ipa
